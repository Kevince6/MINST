<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST 手写数字识别</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>手写数字识别器</h1>

        <div class="canvas-box">
            <canvas id="drawing-board" width="280" height="280"></canvas>
        </div>

        <div class="button-group">
            <button id="clear-btn" class="btn secondary">清除</button>
            <button id="predict-btn" class="btn primary">识别</button>
        </div>

        <div id="result-area">
            <p>预测结果: <span id="prediction-text">?</span></p>
            <p>置信度: <span id="confidence-text">0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
